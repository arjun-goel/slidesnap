services:
  - type: web
    name: slidesnap-lecture-extractor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 7860
      - key: RENDER
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OPENCV_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MAX_JOBS_PER_HOUR
        value: 25
      - key: MAX_CONCURRENT_WORKERS
        value: 1
      - key: RETENTION_HOURS
        value: 24
      - key: SAMPLE_FPS
        value: 1.5
