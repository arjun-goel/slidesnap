services:
  - type: web
    name: slidesnap-lecture-extractor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 7860
      - key: MAX_JOBS_PER_HOUR
        value: 15
      - key: MAX_CONCURRENT_WORKERS
        value: 2
      - key: RETENTION_HOURS
        value: 24
      - key: SAMPLE_FPS
        value: 2.0
